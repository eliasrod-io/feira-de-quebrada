<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- ========================================== -->
  <!-- METADADOS E CONFIGURAÇÕES GLOBAIS          -->
  <!-- ========================================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feira da Quebrada - Mapa Interativo</title>

  <!-- ========================================== -->
  <!-- BIBLIOTECAS EXTERNAS (LEAFLET - MAPA)      -->
  <!-- ========================================== -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- ========================================== -->
  <!-- FONTES EXTERNAS                            -->
  <!-- ========================================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- ========================================== -->
  <!-- ESTILOS E SCRIPTS LOCAIS                   -->
  <!-- ========================================== -->
  <!-- Uso do '../' para sair da pasta pages/ e acessar styles/ e scripts/ -->
  <link rel="stylesheet" href="../styles/mapa.css">
  <script src="../scripts/mapa.js" defer></script>
</head>
<body>

  <!-- ========================================== -->
  <!-- CONTAINER PRINCIPAL DO MAPA                -->
  <!-- ========================================== -->
  <section id="mapContainer" class="map-card-container">
    
    <!-- Cabeçalho de Navegação -->
    <div class="map-card-header">
      <div class="header-title">
        <!-- Corrigido para apontar para o index.html na raiz do projeto -->
        <a href="../index.html" class="btn-voltar">← Voltar</a>
        <h3>📍 Empreendedores na Região</h3>
      </div>
      <span class="badge-tag">Comunidade Local</span>
    </div>

    <!-- Área de Visualização: Lista e Mapa -->
    <div class="map-wrapper">
      
      <!-- Barra Lateral: Lista de Estabelecimentos -->
      <aside class="sidebar-empreendedores">
        <div class="sidebar-header">
          <h4>Lista de Empreendedores</h4>
          <small>Clique para centralizar no mapa</small>
        </div>
        <!-- Esta área será preenchida dinamicamente pelo arquivo mapa.js -->
        <div id="listaEmpreendedores" class="lista-cards"></div>
      </aside>

      <!-- Elemento onde o Leaflet injetará a renderização gráfica do mapa -->
      <div id="mapa" class="map-element"></div>
      
    </div>

    <!-- Rodapé Informativo -->
    <div class="map-card-footer">
      <small>💡 Clique em um card lateral ou nos círculos no mapa para negociar direto pelo WhatsApp.</small>
    </div>
    
  </section>

</body>
</html>
